      // Auto-retry connection to dev server (handles "Connection refused" errors)
      (function () {
        // Check if this is a genuine connection error (dev mode only)
        function isErrorPage() {
          // Only trigger on actual connection error text, not missing hydration
          const bodyText = document.body?.innerText || '';
          return (
            bodyText.includes('refused') ||
            bodyText.includes('ERR_CONNECTION') ||
            bodyText.includes('could not connect') ||
            bodyText.includes('This site can')
          );
        }

        // Retry logic - reload page every 500ms until app loads
        function startRetry() {
          let retryCount = 0;
          const maxRetries = 60; // 30 seconds max

          function tryReload() {

            retryCount++;

            // Check if dev server is ready
            fetch('http://localhost:5173/', { method: 'HEAD', mode: 'no-cors' })
              .then(() => {
                console.log('Dev server ready, reloading...');
                location.reload();

                setTimeout(tryReload, 500);
              });
          }

          // Show connecting overlay
          document.body.innerHTML = `
            <div class="connection-retry">
              <div class="spinner"></div>
              <p>Connecting...</p>
            </div>
