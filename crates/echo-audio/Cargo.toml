[package]
name = "echo-audio"
version = "0.1.0"
edition = "2024"
description = "Echophrase shared audio core: sample math, WAV I/O, the AudioSource path/memory abstraction, and cpal live capture."
license = "MPL-2.0"

[features]
default = []
# Live microphone capture via cpal. Off by default so pure-math consumers
# (transcription backends, transcode) never pull in a platform audio stack.
capture = ["dep:cpal"]

[dependencies]
hound = { workspace = true }
thiserror = { workspace = true }
cpal = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
