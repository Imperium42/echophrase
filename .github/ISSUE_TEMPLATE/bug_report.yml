name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Echophrase is community-maintained, so a clear, reproducible report is the fastest way to a fix.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings > ...
        2. Record ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Echophrase version
      description: Settings > About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - Linux (built from source)
        - Other
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and model
      description: GPU (e.g. RTX 4070, M3, none) and the speech model you use.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove anything personal first.
      render: text
