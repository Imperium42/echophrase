# CI for pull requests and pushes. Uses NO secrets, so it is safe for fork PRs.
# Releases live in release.yml (tag/dispatch only).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check, lint, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test:run
      # Production build also runs the license guard in vite.config.js.
      - run: bunx --bun vite build --mode production

  # Decides whether the Rust matrix needs to run. Docs-only changes (Markdown,
  # images, plain text outside the Rust crates) skip it; anything else, or a
  # base commit we can't resolve, runs it. Plain git, no third-party action.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          # Anything under the Rust trees, or any non-doc file, needs Rust CI.
          if [ -z "$files" ] \
            || echo "$files" | grep -qE '^(src-tauri|crates|cli)/' \
            || echo "$files" | grep -qvE '\.(md|mdx|txt|png|jpe?g|gif|webp|svg)$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docs-only change: skipping the Rust jobs."
          fi

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev

      # Run the real ORT stager (same as release.yml) on every OS, so a broken pin,
      # hash or package layout fails here instead of on a release tag. It also
      # provides the macOS framework file tauri-build checks for at compile time.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Stage ONNX Runtime
        run: bun scripts/ensure-ort.mjs --ci

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy, rustfmt
          # Clippy below already denies warnings; don't also inject -D warnings into test builds.
          build-warnings: warn
          # .cargo/config.toml pins the target dir to src-tauri/target.
          cache-workspaces: ". -> src-tauri/target"

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-default-features

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  licenses:
    name: Attribution is current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-workspaces: ". -> src-tauri/target"
      # Prebuilt binary on PATH (a `cargo install` here built fine but was not found by the
      # cargo that the script invokes).
      - name: Install cargo-about
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-about@0.9.1
      - run: cargo about --version
      # Regenerates ATTRIBUTION.md + THIRD-PARTY-NOTICES.txt (the www sibling write is
      # skipped when ../echophrase-www is absent). Fails if the committed copies are stale.
      - name: Regenerate attribution
        run: bun run licenses:generate
      - name: Check attribution is committed
        run: |
          git diff --exit-code -- ATTRIBUTION.md src-tauri/licenses/THIRD-PARTY-NOTICES.txt \
            || { echo "::error::Attribution is stale. Run 'bun run licenses:generate' and commit the result."; exit 1; }
